<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">Ocean adventure game environment</title><desc id="desc">A tropical island, dolphin, fish, turtle and coral reef in a bright blue ocean.</desc><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#b8eaff" /><stop offset="1" stop-color="#ecfbff" /></linearGradient><linearGradient id="sea" x2="0" y2="1"><stop stop-color="#4ccbd9" /><stop offset="1" stop-color="#157fac" /></linearGradient><clipPath id="underwater-zone"><rect x="0" y="265" width="1000" height="185" /></clipPath></defs><style>.line{stroke:#20556b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.cloud{animation:drift 16s ease-in-out infinite}.boat{animation:bob 4s ease-in-out infinite;transform-origin:350px 230px}.fish{animation:swim 9s ease-in-out infinite}.turtle{animation:swim 14s ease-in-out infinite reverse}.wave{animation:drift 7s ease-in-out infinite}.bubble{animation:rise 6s ease-in-out infinite}.spark{animation:glow 4s ease-in-out infinite}@keyframes drift{50%{transform:translateX(20px)}}@keyframes bob{50%{transform:translateY(-7px) rotate(1deg)}}@keyframes swim{50%{transform:translateX(35px) translateY(-5px)}}@keyframes rise{50%{transform:translateY(-18px);opacity:.4}}@keyframes glow{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1000" height="450" rx="28" fill="url(#sky)" /><g transform="translate(840 75)"><circle r="40" fill="#ffda71" /><path d="M-15 0v3m30-3v3M-13 15q13 13 26 0" fill="none" class="line" /><g stroke="#ffda71" stroke-width="7" stroke-linecap="round"><path d="M0-55v-10M0 55v10M55 0h10M-55 0h-10M40-40l8-8M-40-40l-8-8" /></g></g><g class="cloud" fill="white"><path d="M65 90q-5-25 23-25 10-33 38-12 30-8 34 20 28 2 23 21H65Z" /><path d="M550 66q-2-20 20-20 12-27 34-10 25-6 28 15 23 0 20 17H550Z" /></g><path d="M0 210Q150 180 300 207T600 207T1000 200V450H0Z" fill="url(#sea)" /><path class="wave" d="M0 250q65-22 130 0t130 0t130 0t130 0t130 0t130 0t130 0t130 0V290H0Z" fill="#83e1e0" opacity=".5" /><g transform="translate(740 130)"><path d="M-50 110q120-100 240 5Z" fill="#ffdc8c" class="line" /><path d="M40 93q30-55 21-110" fill="none" stroke="#9c704a" stroke-width="15" /><path d="M60-10q-50-38-74 4 37-10 62 11-39-8-50 30 38-24 61-24 20 10 40 28-3-39-28-40 43-13 63 0-21-40-64-10Z" fill="#73c884" class="line" /><path d="M110 63h45v31h-45z" fill="#d89356" class="line" /><path d="M110 70h45M133 65v26" fill="none" stroke="#ffdb70" stroke-width="5" /></g><g fill="none" stroke="#c6faf2" stroke-width="4" stroke-linecap="round" class="wave"><path d="M210 290q25 10 50 0m175 10q30 9 60-3M80 230h35m500 40h45m100 44h55" /></g><g clip-path="url(#underwater-zone)"><g transform="translate(170 365)"><g class="fish line"><path d="M-32 0l-25-20v40Z" fill="#ffce6e" /><ellipse rx="35" ry="22" fill="#ff9a72" /><path d="M-10-20v40" stroke="#fff3d4" stroke-width="10" /><circle cx="18" cy="-4" r="3" /></g></g></g><g clip-path="url(#underwater-zone)"><g transform="translate(730 367)"><g class="fish line"><path d="M-26 0l-20-15v30Z" fill="#a8a0e6" /><ellipse rx="29" ry="18" fill="#b5b7f0" /><circle cx="15" cy="-3" r="3" /></g></g></g><g clip-path="url(#underwater-zone)"><g transform="translate(440 365)"><g class="turtle line"><ellipse cx="-20" cy="-24" rx="16" ry="8" fill="#8cd2a5" /><ellipse cx="-20" cy="24" rx="16" ry="8" fill="#8cd2a5" /><ellipse cx="23" cy="-23" rx="16" ry="8" fill="#8cd2a5" /><ellipse cx="23" cy="23" rx="16" ry="8" fill="#8cd2a5" /><ellipse rx="40" ry="29" fill="#6dbb9b" /><path d="M-15-20l30 0 13 20-13 20h-30L-28 0Z" fill="#a0d99d" /><ellipse cx="53" cy="0" rx="19" ry="15" fill="#9cdbb2" /><circle cx="59" cy="-4" r="2" /></g></g></g><g clip-path="url(#underwater-zone)"><g transform="translate(580 310)"><g class="fish line"><path d="M-50 20q22-65 75-25l30 0-14 13q-34-12-57 13l-30 10 5-22-22-1Z" fill="#86c8df" /><path d="M-4-8l-8-25 24 18" fill="#86c8df" /><circle cx="28" cy="2" r="2" /></g></g></g><g class="line" fill="none" stroke-width="9"><path d="M75 450v-45m0 20-20-16m20 4 22-22" stroke="#ef9ca8" /><path d="M900 450v-53m0 28 20-18m-20 5-18-18" stroke="#c19bdd" /><path d="M840 450q-30-30 0-55m-5 55q25-34 10-40" stroke="#67c7af" /></g><g class="bubble" fill="none" stroke="#b0eced" stroke-width="3"><circle cx="240" cy="360" r="6" /><circle cx="247" cy="335" r="4" /><circle cx="810" cy="350" r="8" /><circle cx="820" cy="320" r="4" /></g><g class="spark" fill="#fff6c8"><path d="m520 130 4 9 10 4-10 4-4 10-4-10-10-4 10-4Z" /><path d="m660 310 3 7 8 3-8 3-3 8-3-8-8-3 8-3Z" /></g></svg>